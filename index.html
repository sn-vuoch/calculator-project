<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap"
      rel="stylesheet"
    />
    <title>Calculator App</title>

    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="display-box">
        
      </div>
      <div class="digit-button">
        <div class="left-container">
          <div class="row row-1">
            <button>1</button>
            <button>2</button>
            <button>3</button>
          </div>
          <div class="row row-2">
            <button>4</button>
            <button>5</button>
            <button>6</button>
          </div>
          <div class="row row-3">
            <button>7</button>
            <button>8</button>
            <button>9</button>
          </div>
          <div class="row row-4">
            <button>.</button>
            <button>0</button>
            <button>Clear</button>
          </div>
        </div>
        <div class="right-container">
          <button>+</button>
          <button>-</button>
          <button>×</button>
          <button>÷</button>
          <button>=</button>
        </div>
      </div>
    </div>
  </body>
</html>
